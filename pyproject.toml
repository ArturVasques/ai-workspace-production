[project]
name = "ai-workspace-production"
version = "1.0.0"
description = "Production-oriented AI application with FastAPI, OpenAI Agents SDK, PostgreSQL and pgvector."
requires-python = ">=3.13"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "openai",
    "openai-agents",
    "pydantic-settings",
    "psycopg[binary,pool]",
    "pgvector",
    "alembic",
    "python-multipart",
    "httpx",
    "structlog",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.setuptools.packages.find]
include = ["app*"]