services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: ai_workspace_production
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_workspace_production"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ai_workspace_production
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL}

      RAG_TOP_K: 5
      RAG_MAX_DISTANCE: 0.8
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: development
      LOG_LEVEL: INFO

      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ai_workspace_production
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL}

      RAG_TOP_K: 5
      RAG_MAX_DISTANCE: 0.8
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data: